name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.18"

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is arm64 and ubuntu-24.04 is x86_64, the two platforms the lock declares.
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is stale, which is the point. On Linux the default groups
      # install no harness, because every mac entry is darwin-marked, so the linux-harness
      # group is added there: without it onnxruntime, numpy, opencv, trackers and trackeval
      # are absent, every test that reaches an ONNX graph skips through importorskip, and the
      # Linux half of the matrix proves far less than it appears to. The group itself is
      # declared in pyproject.toml and described in the Environments section of TRAINING.md;
      # the dev group is kept on both runners because the test tooling lives in it.
      - name: Sync default env
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then uv sync --locked --group linux-harness
          else uv sync --locked; fi

      # ruff, the file-hygiene hooks, the large-file check and every local guard: the two
      # halves of the no-fisheye name rule, the fisheye primitive ban, the AGPL quarantine,
      # both halves of the face-biometric deny-list, the two training-data layers and the
      # re-identification weight-source deny-list. This step is the only place they run in
      # continuous integration; the self-test below is what proves each still rejects a real
      # violation.
      - name: Pre-commit (all files)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Import-linter contracts
        run: uv run lint-imports

      - name: Guardrails self-test (guards must reject real violations)
        run: bash scripts/guards/selftest.sh

      # No training configuration may load an evaluation-reference checkpoint. This is the
      # third layer of that rule, next to the filename suffix and resolve_for_training() in
      # src/vividly/models/checkpoints.py. A pure comment line is exempt, because a
      # configuration is entitled to carry a warning naming the checkpoint it must not use,
      # and a check that forces deleting a safety warning is guarding the wrong thing. Any
      # code line still fails.
      - name: No evaluation-reference checkpoint in a training configuration
        run: |
          ! grep -rn "EVALREF" third_party/configs/ configs/events/ configs/reid/ \
            | grep -v -E "^[^:]+:[0-9]+:\s*#" \
            || { echo "evaluation-reference checkpoint referenced in a training configuration"; exit 1; }

      - name: Install ffmpeg (the media layer and the demo platform shell out to it)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          else brew install ffmpeg; fi

      - name: Unit tests
        run: uv run pytest -m "not gpu and not slow" --cov=vividly --cov-report=term-missing

      # --no-sync everywhere: a bare `uv run` re-syncs to the default groups and extras, which
      # on a training box would quietly uninstall torch.
      - name: Script CLIs still parse
        run: |
          uv run --no-sync python scripts/eval/eval_runner.py --help
          uv run --no-sync python scripts/run_pipeline.py --help
          uv run --no-sync python scripts/events/extract_track_sequences.py --help
          uv run --no-sync python scripts/events/train_event_verifier.py --help

      # A configuration that no longer parses is otherwise discovered on a rented GPU.
      - name: Every shipped config is loadable YAML
        run: |
          uv run --no-sync python -c "import glob, pathlib, yaml; roots = ['configs/checkpoints', 'configs/convert', 'configs/datasets', 'configs/eval', 'configs/events', 'configs/pipeline', 'configs/reid', 'third_party']; paths = sorted({p for r in roots for p in glob.glob(r + '/**/*.y*ml', recursive=True)}); assert paths, 'no YAML found under ' + ', '.join(roots); [yaml.safe_load(pathlib.Path(p).read_text()) for p in paths]; print('ok: {} configs parsed'.format(len(paths)))"

  resolve-forks:
    name: every dependency fork still resolves
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Lockfile is current
        run: uv lock --check

      # Resolution only, so no gigabytes of CUDA wheels are downloaded. This catches upstream
      # drift in seconds rather than on a rented GPU. --no-default-groups drops dev and mac, so
      # each fork is exercised in the isolation README.md's Environments and guards section
      # installs it in; without it every fork drags the mac group along and the export proves
      # nothing about the fork itself. linux-harness is a group rather than an extra, but the
      # conflicts table treats it as a fork in its own right, and it is the only environment
      # that can run an exported graph on the deployment platform, so it is resolved here too.
      - name: Export each fork
        run: |
          uv export --extra cuda            --no-default-groups --no-emit-project --no-hashes --format requirements.txt > /dev/null
          uv export --extra eval-agpl       --no-default-groups --no-emit-project --no-hashes --format requirements.txt > /dev/null
          uv export --extra curate          --no-default-groups --no-emit-project --no-hashes --format requirements.txt > /dev/null
          uv export --group linux-harness   --no-default-groups --no-emit-project --no-hashes --format requirements.txt > /dev/null

      # trackeval ships in the curate extra and in both harness groups, never in the cuda
      # extra. It must not ride along into the training environment.
      - name: Tracking metrics stay out of the cuda fork
        run: |
          test "$(uv export --extra cuda --no-default-groups --no-hashes | grep -c '^trackeval')" -eq 0
          echo "ok: trackeval absent from the cuda fork"

      # The AGPL wall as a property of the resolved fork rather than of the conflicts table
      # alone: neither AGPL distribution may appear in the environment a training run installs.
      - name: No AGPL distribution in the cuda fork
        run: |
          resolved="$(uv export --extra cuda --no-default-groups --no-hashes)"
          for banned in ultralytics boxmot; do
            test "$(echo "$resolved" | grep -c "^${banned}")" -eq 0 \
              || { echo "FAIL: ${banned} resolved into the cuda fork"; exit 1; }
          done
          echo "ok: no AGPL distribution in the cuda fork"

      - name: Conflicts are still declared
        run: |
          if uv sync --extra cuda --extra eval-agpl 2>/dev/null; then
            echo "FAIL: cuda and eval-agpl resolved together; the AGPL quarantine is broken"; exit 1
          fi
          if uv sync --extra cuda --extra curate 2>/dev/null; then
            echo "FAIL: cuda and curate resolved together; the numpy wall is broken"; exit 1
          fi
          if uv sync --extra eval-agpl --extra curate 2>/dev/null; then
            echo "FAIL: eval-agpl and curate resolved together; AGPL would co-install with the shippable tracker"; exit 1
          fi
          echo "ok: all three conflict pairs rejected"
