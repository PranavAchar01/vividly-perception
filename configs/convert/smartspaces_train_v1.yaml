# SmartSpaces train-side conversion v1 (top-view slice -> v2 training corpus).
#
#   uv run python scripts/data/convert_smartspaces.py --config configs/convert/smartspaces_train_v1.yaml --dry-run
#   uv run python scripts/data/convert_smartspaces.py --config configs/convert/smartspaces_train_v1.yaml
#
# Emits, per train scene, frames/train/<Scene>/<Camera>/<frame:06d>.jpg plus
# annotations/smartspaces_train_<Scene>_coco.json, carrying visible-region person
# boxes exactly as released (house box convention, research/v2-training-stack.md
# section 7e). stride 30 = 1 sampled frame per second of 30 fps footage: adjacent
# frames are near-duplicates; recording diversity, not frame density, is what a
# corpus buys accuracy with. Robots (Forklift / NovaCarter / Transporter) are
# counted in the report and never emitted. Empty sampled frames are kept: they are
# real negatives.
#
# Val scenes are not here: the val split is exam-side (the frozen-exam rule in the
# registry entry). A val conversion, when the probe surface needs it, is a separate
# config with split: val. The exam rule is enforced by the split config and the
# registry, not by pretending the bytes cannot be read.
schema_version: 1
dataset: physicalai_smartspaces
split: train
scenes: [Warehouse_000, Warehouse_001, Warehouse_002, Warehouse_003, Warehouse_004, Warehouse_005]
stride: 30
object_types: [Person]
min_side_px: 2.0
keep_empty: true
jpeg_q: 2
frames_dir: frames
annotations_dir: annotations
