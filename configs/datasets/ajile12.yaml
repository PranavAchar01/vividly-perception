notes: >
  Negative-diet source for the seizure lane. Three measurements, the seizure v4
  ward negatives, the v6 home-room negatives and the fall v2 mirror, established
  that quiet must come from deployment-context-matched footage; AJILE12 is EMU
  patient-room wall-camera context, the same context as the WU-SAHZU exam.
  Diet rule, non-negotiable and recorded with the admission: negative windows are
  drawn only from spans positively labelled as normal activity in each session's
  intervals and epochs table (Sleep/rest, Inactive, Eat, Talk, TV, Computer/phone,
  Other activity and their combinations). Blocklist spans (Data break, Camera
  move/zoom, Private time) and all unlabelled time are excluded, so unannotated
  clinical events cannot enter the diet, and an everything-minus-seizures
  selection is barred. Patients' seizure spans are never used as positives,
  because the labels are not available for repurposing. Probe measurements on
  sub-04 ses-3, the smallest file: 313 epoch intervals covering 24.0 h, of which
  about 4.7 h is positively labelled normal activity in that worst case. 9
  keypoints at 2,592,000 samples per day per joint confirm 30 Hz over 24 h of
  continuous coverage.
