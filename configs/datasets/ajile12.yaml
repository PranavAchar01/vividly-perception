provenance:
  collector: Peterson et al. (Brunton lab, University of Washington)
  imagery_source: >
    no imagery in the deposit that is used here: 2D upper-body pose
    trajectories (9 keypoints, that is nose, ears, shoulders, elbows and
    wrists, at 30 Hz in camera-plane pixels) estimated by the authors from
    wall-mounted patient-room video during clinical epilepsy monitoring stays
    of 7 to 9 days; 12 patients, 55 patient-days. Faces and video never leave
    the source institution; the ingest is pose and interval labels only, which
    respects the motion-level boundary recorded in POLICY.md, rule 4.
  contains_real_people: true
  simulated_medical_events: false
  # The source stays are clinical epilepsy monitoring, so the patients' real
  # seizures occur during the recorded days. The harvest takes pose and
  # activity labels only, and the diet rule below draws negatives solely from
  # labelled-normal spans, but the entry declares the events honestly, which is
  # also what binds it to the event-grant machinery.
  real_medical_events: true
  citation: >
    Peterson, Singh, Dichter, Scheid, Rao, Brunton, "AJILE12: Long-term
    naturalistic human intracranial neural recordings and pose", Scientific
    Data 9, 184 (2022). doi:10.1038/s41597-022-01280-y
acquisition:
  method: http
  human_required: false
  urls:
    - https://dandiarchive.org/dandiset/000055
    - https://api.dandiarchive.org/api/dandisets/000055/versions/draft/assets/
  human_steps: []
layout:
  root: data/train_prototype/ajile12
  # Harvested by scripts/data/harvest_ajile12.py: per-session pose npz plus
  # epochs.json interval labels; the harvest is complete, 55 of 55 sessions on
  # disk. No train and val split is declared here on purpose. The diet assembly
  # over labelled-normal spans only has run: scripts/data/assemble_ajile12_diet.py
  # under configs/events/ajile12_diet_v1.yaml emits the extraction-shaped negative
  # tree that 57 training configs consume with force_label 0: every convulsion
  # rotation recipe under configs/events/rot_train_conv_*.yaml except the arm-A
  # files rot_train_conv_rot_f*_s*.yaml, which do not read it, plus the four
  # head-to-head configs configs/events/h2h_conv_rotB_f2_*.yaml. Nothing here
  # is a test surface: WU-SAHZU remains the only seizure exam.
  images: {train: sessions, val: sessions}
  annotations: {train: sessions, val: sessions}
ann_format: ajile12_nwb_harvest
