                                 # it, so pinning the manifest pins the corpus
                                 # without inlining 110 rows.
  - name: manifest.jsonl
    sha256: e78d623d25325db3b2d59e28445a49d3224feb28c781c9ee4fcf91dbfba84190
    size_bytes: 22380
hashes_unavailable_reason: null   # harvest finished; hashes are in manifest.jsonl above
