notes: >
  Second interim fall training set, alongside gmdcsa24, admitted 2026-08-27 after
  the split verdict of fall v2 measured that the verifier needs positive-side
  angle, subject and scene diversity (research/event-verifier-v1-record.md). The
  high-corner camera is the closest licensed public angle to an elevated view;
  true overhead fall footage exists only in the multicam_fall exam set, which
  never trains. Landed shape, measured 2026-08-27 across all 100 sequences: each
  sequence directory holds one .avi, the source of record, whose
  container-measured 20.00 fps caught the paper's declared 23 being wrong, plus
  per-frame stills and YOLO label txts as the label layer, where class 1 means
  falling and classes.txt reads `nofall`/`fall`. vividly.data.convert.caucafall
  symlinks videos/S{n}/<activity>.avi, reads the fall span from the first to the
  last class-1 frame on the trailing-digit numbering of the stills, and writes
  annotations/index.json; its module docstring records every absorbed defect (one
  `- copia` stray excluded, 4 numbering holes, 6 unlabelled stills, stills running
  one frame past every container and 23 past the truncated avi of S6 Fall
  backwards, one mid-fall label flicker). Class-1 spans include the
  lying-on-floor aftermath, with a median span of 7.0 s against the short dynamic
  fall intervals of le2i, so they yield more positive windows per fall. This is
  noted so that span lengths are not read as comparable across sets. The
  recordings of activities of daily living double as quiet-footage negatives for
  fall training, requested on 2026-08-27, and were drawn as side-view seizure
  negatives once, by the pre-declared recipe
  configs/events/train_convulsion_v6_real.yaml, which selects the no-event clips
  with no_event_only and force_label 0. That arm was rejected on its exam look
  (final_models/seizure/README.md), so no promoted seizure model is trained on
  this set.
