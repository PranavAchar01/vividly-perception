provenance:
  collector: J. C. Eraso, E. Munoz, M. Munoz, J. Pinto (Universidad del Cauca)
  imagery_source: >
    actors performing staged falls and activities of daily living in an
    uncontrolled home environment: 10 subjects, 5 fall types (forward,
    backward, left, right, from sitting) plus 5 activities of daily living
    (walking, hopping, picking up an object, sitting, kneeling) each; single
    camera mounted in the upper corner of the room, giving a high-angle view.
    Measured on landing 2026-08-27 against every container: 720x480 at 20.00
    fps, so the record page's figure of 1080x960 and the paper's figure of 23
    fps are both wrong for this distribution. The set carries occlusions,
    lighting changes (natural, artificial, night) and background motion; one
    .avi per sequence plus per-frame stills with YOLO-style label txts, where
    class 1 means falling.
