# Measured against the bytes (the paper's own counts are 79 fall + 81 ADL): 160 clips
# on disk; the CSV row for S4 Fall 15 carries a fall label with no interval bracket, so
# the index holds 159 = 78 fall + 81 ADL (summary.fall_unlabeled_excluded lists the clip).
# Containers mix about 15 fps and about 29.9 fps cameras, so fps is per video and is
# never assumed.
counts: {videos: 160, videos_indexed: 159, falls: 78, adl: 81, subjects: 4}
derived_from: []
notes: >
  Second interim fall training set, alongside caucafall, admitted 2026-08-27 after
  the split verdict of fall v2 measured that the verifier needs positive-side angle,
  subject and scene diversity (research/event-verifier-v1-record.md).
  Version skew measured on landing: the Zenodo v2.0 zip, a git archive of commit
  d3edb5d, ships interval-less `File Name,Length,Description` CSVs, while GitHub
  commit 5abac769 (2024-08-21) rewrote exactly those 8 CSVs, and nothing else, into
  the interval format, so the zip's videos are byte-identical to master's. The
  interval CSVs are pinned at that commit under annotations_upstream/, which
  vividly.data.convert.gmdcsa24 prefers over the zip's own CSVs; the module docstring
  records every absorbed annotation defect (missing `to`, missing `]`, the
  `Fall (FW)` label variant, one reversed context interval dropped, one unlabelled
  fall excluded). videos/ holds relative symlinks into upstream/ with space-free
  paths and keys such as S1_Fall__01; annotations/index.json carries events_t in
  seconds. ur_fall and multicam_fall remain the untouched held-out exams, because a
  dataset that trains loses its test role permanently.
