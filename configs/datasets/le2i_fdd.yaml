notes: >
  Interim training set for the fall verifier (event_grant.role train_interim), and the
  first fall set admitted for training, alongside caucafall and gmdcsa24; ur_fall and
  multicam_fall stay held-out tests. The 8.95 GiB FallDataset.zip from dat@UBFC lands
  under upstream/ as a zip of six location zips;
  videos/<Location>/video_NNN.avi and annotations/<Location>/video_NNN.txt are
  materialised from it, together with annotations/index.json through
  vividly.data.convert.le2i.write_index. The distribution's irregularities are recorded
  in that module's docstring: per-video container fps mixes 24.0003 and 25.0, so time
  alignment must use each video's own fps; three files have the fall-interval header
  spliced mid-file; one file has reversed box corners; 13 files have more annotation rows
  than frames. Per-frame bounding boxes ride along and are usable as extra
  detector-domain evidence, but the primary role of this set is fall-interval ground
  truth for verifier training clips.
