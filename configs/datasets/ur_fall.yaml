provenance:
  collector: Bogdan Kwolek & Michal Kepski, University of Rzeszow / AGH
  imagery_source: >
    volunteers performing staged falls (30 sequences, two Kinect cameras: cam0
    ceiling-parallel and close to overhead, cam1 lateral) and daily activities (40
    sequences of activities of daily living, cam0), in office and lab rooms, with
    accelerometer synchronisation
  contains_real_people: true
  simulated_medical_events: true
  citation: >
    Bogdan Kwolek, Michal Kepski, "Human fall detection on embedded platform using depth
    maps and wireless accelerometer", Computer Methods and Programs in Biomedicine, 117(3),
    December 2014, 489-501.
acquisition:
  method: http
  human_required: false
  urls:
    - http://fenix.ur.edu.pl/~mkepski/ds/uf.html
  human_steps: []
layout:
  root: data/eval_only/ur_fall
  # val aliases test, which is the default split name of the eval manifest. Nothing
  # trains here, so the alias contaminates nothing.
  images: {test: videos, val: videos}
  annotations: {test: labels, val: labels}
ann_format: ur_fall_csv
converter: vividly.data.convert.ur_fall
hashes_unavailable_reason: null
counts: {fall_sequences: 30, adl_sequences: 40, videos: 100}
derived_from: []
notes: >
  Held-out test set for the interim fall verifier. This dataset never trains
  (event_grant.role test_only), because a dataset that trains loses its test role.
  Videos are mp4 (fall-NN-cam0, fall-NN-cam1, adl-NN-cam0); labels/fall-NN-data.csv
  carries the frame synchronisation (frame, ms, interval), and the per-frame event
  ground truth lives in labels/urfall-cam0-falls.csv and urfall-cam0-adls.csv, whose
  columns are sequence, frame and label, where -1 is not lying, 0 is falling and 1 is
  lying, followed by depth and accelerometer features. Depth zips and raw accelerometer
  streams exist upstream and were deliberately not fetched, because the product is
  camera-only. Fetch script: scripts/data/fetch_ur_fall.sh.
