    license: apache-2.0 (dataset card metadata). Released with VSViG (ECCV 2024,
    arXiv:2311.14775) by the Second Affiliated Hospital of Zhejiang University /
    Westlake University group; the card states data were collected under hospital
    ethics approval with patient consent and faces are masked.
  license_conflict_note: >
    The licence itself is permissive, but this is real clinical footage of real
    patients' seizures. Whether an Apache-2.0 grant by the publishing group is a
    sufficient basis for any commercial use of models influenced by this data is a
    counsel question (CQ-23), flagged and not absorbed. The current role is an
    engineering-only held-out test set that trains nothing; any training use is a
    separate owner decision, executed as a new disjoint-patient TRAIN_PROTOTYPE entry,
    and nothing touched by this data ships commercially without counsel sign-off.
  commercial_use: conflicting
  attribution_required: true
  redistribute: false
  counsel_questions: [CQ-23-clinical-emu-video-use]
