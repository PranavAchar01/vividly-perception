ann_format: wu_sahzu_label_xlsx
converter: vividly.data.convert.wu_sahzu
hashes_unavailable_reason: null
# videos is the 36 the converter indexes: 33 labelled seizure videos plus 3 non-seizure
# recordings. dataset/pat05/Sz4PG.mp4 ships with no Label.xlsx row, so it is excluded
# entirely: it is unusable as a positive, having no onset, and unsafe as a negative,
# because it is named as a seizure recording.
counts: {patients: 14, seizures: 33, convulsive_seizures: 14, focal_seizures: 19, videos: 36}
derived_from: []
notes: >
  Exam-side patient pool for the convulsion verifier: the only real clinical seizure
  footage in this repository, and the source of every seizure exam surface. The exam of
  record is the 16-video, six-patient testsplit declared in
  configs/events/eval_wusahzu_testsplit_v2real.yaml, where convulsion_v2_real, ONNX
  07c399be, scores window AUC 0.69841 (final_models/seizure/README.md). The four focal
  patients kept out of both training and the testsplit are measured as the E1 focal exam
  (configs/events/rot_eval_E1_finalB_v2c.yaml) and as the unallocated supplement
  (configs/events/eval_wusahzu_unallocated_v2.yaml). Seizure types are recorded per
  patient. PG (focal-to-generalized tonic-clonic, 7 patients, 14 events) is the
  convulsive class the verifier targets; P (focal, 7 patients, 19 events) often shows
  subtle or no convulsive motion and is reported separately, never folded into the
  headline number.
  The irregularities in Label.xlsx are recorded in the converter docstring: onset cells
  are Excel day-fractions and must be multiplied by 86400; PatID and type are
  forward-filled merged cells; EEG onset precedes clinical onset; there are no end
  times, so the paper's heuristic of under 2 minutes applies. Recordings range from 80 s
  to 61 min; the converter re-encodes and cuts long files around clinical onset into
  clips/, recording cut_start_s, and never modifies upstream bytes.
  The training split granted later is a separate registry entry over patients disjoint
  from this one, configs/datasets/wu_sahzu_emu_trainsplit.yaml, so that the
  machine-enforced train and test exclusivity holds.
