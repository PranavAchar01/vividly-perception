    recorded at the Second Affiliated Hospital of Zhejiang University School of
    Medicine EMU
  imagery_source: >
    real epilepsy-monitoring-unit recordings: 14 patients, 33 expert-annotated seizure
    events plus non-seizure recordings, a single wall-mounted or ceiling-mounted Bosch
    camera, 1080p at 30 fps, hospital beds with occlusion from blankets, pillows and
    visitors; patient faces are masked upstream; per-event EEG onset and clinical onset
    timestamps come from epileptologists
  contains_real_people: true
  simulated_medical_events: false
  real_medical_events: true
  citation: >
    Y. Xu, J. Wang, et al., "VSViG: Real-time Video-based Seizure Detection via
