# The patient split, enforced by the disjointness check in
# tests/test_wu_sahzu_shootout.py and the `locations:` filters in configs/events/:
#   train patients (this entry): pat01, pat02, pat05, pat13, convulsive PG, 8 events.
#   testsplit of record for convulsion_v2_real (final_models/seizure/README.md):
#   pat03, pat07, pat14 (PG, 6 events), pat04, pat09, pat11 (P, 7 events) and all 3
#   non-seizure recordings.
#   permanently exam-side, enforced by scripts/guards/check_train_data_paths.py, whose
#   EXAM_LOCATIONS names pat06, pat08, pat10 and pat12 the focal exam and pat03 and
#   pat07 the convulsive exam; an exam recording never trains. The focal four, whose
#   onsets are uncertain, are measured as the E1 focal exam
#   (configs/events/rot_eval_E1_finalB_v2c.yaml) and the unallocated supplement
#   (configs/events/eval_wusahzu_unallocated_v2.yaml).
#   the rotation recipes under configs/events/rot_train_conv_*.yaml train on a wider
#   pool than this entry holds: configs/events/rot_train_conv_finalB_v2c.yaml lists the
#   eight patients pat01, pat02, pat04, pat05, pat09, pat11, pat13 and pat14, so pat04,
#   pat09, pat11 and pat14 train there while their bytes stay outside this entry.
counts: {patients: 4, seizures: 8, videos: 8}
# This entry is not derived_from wu_sahzu_emu in the registry's contamination sense:
# both entries are independent slices of the same upstream Hugging Face release, with
# byte-identical files whose hashes are above, split by patient. The contamination
# control here is patient-level disjointness (tests/test_wu_sahzu_shootout.py), which is
# stronger than tree lineage: no byte of a test patient exists under this root.
derived_from: []
notes: >
  Training split for the variant comparison: the four patients whose bytes this entry
  holds are the training split for the nine convulsion recipes pinned by
  tests/test_wu_sahzu_shootout.py (v1_real and v1_synthreal, v2_real, the four v3 variants
  v3_real, v3_h128, v3_d4 and v3_h128e90, v2pose and v6_real), from the interim comparison
  variants (finalv1real and finalv1synthetic+real) through the seizure model of record,
  convulsion_v2_real. The
  rotation recipes under configs/events/rot_train_conv_*.yaml instead read the
  eight-patient pool through the wu_sahzu track trees, bounded by the exam set that
  scripts/guards/check_train_data_paths.py enforces. It
  was created after the pre-registered synthetic-only evaluation caught 0 of 14 real
  convulsive events (research/event-verifier-v1-record.md), under the pre-authorised
  comparison branch. The split is at patient level: the bytes of these four patients
  were copied out of the eval tree so that the physical separation of training and
  evaluation holds; the wu_sahzu_emu entry keeps every patient for the pre-registered
  number over all 33 events, and the comparison test reads only the six test patients
  through `locations:` filters. Training windows come from a shared extraction run
  directory, which is a build output under the gitignored outputs/ tree, filtered to
  these patients by the same `locations:` mechanism: the interim comparison variants read
  outputs/events/wu_sahzu_tracks_v1 (configs/events/train_convulsion_v1_real.yaml and
  configs/events/train_convulsion_v1_synthreal.yaml), and the seizure model of record
  reads outputs/events/wu_sahzu_tracks_v2
  (configs/events/train_convulsion_v2_real.yaml). The current extraction generation is
  v2c, declared in configs/events/extract_wu_sahzu_v2c.yaml. Event ground truth is
  the interval from clinical onset to onset plus 120 s, taken from the wu_sahzu_emu
  mirror's dataset/Label.xlsx: this entry's root holds patNN/*.mp4 with no workbook
  beside them, and src/vividly/data/convert/wu_sahzu.py reads root/dataset/Label.xlsx of
  the wu_sahzu_emu layout. The day-fraction handling is recorded in the converter
  docstring.
