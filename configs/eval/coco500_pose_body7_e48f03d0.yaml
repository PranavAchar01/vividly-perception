# Joints lane, row 1 of 3, the reproduction row of the deployed-path pose ladder
# (2026-09-05).
#
#   uv run python scripts/pose/eval_pose_ladder.py \
#       --config configs/eval/coco500_pose_body7_e48f03d0.yaml \
#       --config configs/eval/coco500_pose_v2_6ba96285_noflip.yaml \
#       --config configs/eval/coco500_pose_v2_6ba96285_flip.yaml
#
# Why this row exists. The other two rows put the v2 pose ONNX on the CPU rtmlib path
# with detector boxes for the first time. A new number on a path nothing has been
# measured on is unfalsifiable, so the ladder opens by re-running the exact leg that
# already has a recorded answer: `coco500_eyes_stockm_20260826_111338_2db41bba` [clean],
# det AP 0.682, kpt AP 0.729 (research/pose-deployed-path-cpu-proof.md, and the
# machine-generated research/stats-compendium.md). Same frozen subset,
# same stock-m eyes, same body7 pose. If this row does not land on 0.729, the instrument
# has moved (rtmlib/onnxruntime/opencv version, cached asset, staged imagery) and the
# ladder stops: the runner enforces that through the `gate:` block below, and the
# v2 rows never run.
#
# This is a clone of configs/eval/coco500_eyes_stockm.yaml with the gate block added; the
# condition list is identical (clean only) and the stock runner
# (scripts/eval/eval_runner.py) still accepts it unchanged and simply ignores `gate`.
#
# **Provenance warning.** Eval-smoke provenance, not a Vividly accuracy claim. The pose
# model in this row is body7-trained (AI Challenger + COCO + CrowdPose + MPII + sub-JHMDB +
# Halpe + PoseTrack18) and ships nowhere. Its lineage, its checkpoint sha256 and its
# cached-graph sha256 are recorded on the joints lane page, final_models/joints/README.md.
schema_version: 1
run_name: coco500_pose_body7_e48f03d0

dataset:
  registry_name: coco
  split: val
  # Frozen subset, committed, fingerprint 2db41bbad264b7dc. Never re-sampled: the whole
  # point of this row is comparability with the 2026-08-26 run.
  subset_file: configs/eval/subset_coco_val_person500.json

detector:
  # Boxes source for all three rows. Stock rtmdet-m person at 640, the v1 extraction eyes.
  # The 235e8209 token in the URL is the upstream .pth digest prefix, not the graph's; the
  # cached ONNX digest is pinned below.
  backend: rtmlib
  onnx: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmdet_m_8xb32-100e_coco-obj365-person-235e8209.zip
  input_size: [640, 640]
  device: cpu
  score_thr: 0.05                        # low on purpose: COCO mAP needs the tail
  name: rtmdet-m-person-onnx
  sha256: 4f4d7e07350b1753299111d1ae500fd64447a5b0e38e4bacbefab6573c742d30

pose:
  backend: rtmlib
  onnx: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-m_simcc-body7_pt-body7_420e-256x192-e48f03d0_20230504.zip
  input_size: [192, 256]
  device: cpu
  name: rtmpose-m-body7-onnx
  sha256: 5c0a4bf67953e6d2ac43ce15e77dc9d5d354ae18430a47d2c5963a7bc5683e3c

tracker: null

conditions:
  - name: clean
    kind: passthrough

# Read only by scripts/pose/eval_pose_ladder.py. A row carrying a `gate` must land inside
# it or the ladder aborts before the next config is built.
gate:
  metric: kpt_AP
  expected: 0.729
  tol: 0.005
  source: >
    run coco500_eyes_stockm_20260826_111338_2db41bba [clean]: det AP 0.682, kpt AP 0.729,
    quoted at research/pose-deployed-path-cpu-proof.md and recorded in the machine-generated
    research/stats-compendium.md

logging:
  out_root: outputs/eval
