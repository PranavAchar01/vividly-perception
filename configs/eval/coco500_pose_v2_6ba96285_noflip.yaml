# Joints lane, row 2 of 3, the v2 pose model of record on the deployed path (2026-09-05).
#
#   uv run python scripts/pose/eval_pose_ladder.py \
#       --config configs/eval/coco500_pose_v2_6ba96285_noflip.yaml
#
# What this measures, and what it is not. The scorecard number for this model, COCO
# val2017 AP 0.774115 (research/pose-seed-floor-and-champion.md), was measured
# trainer-side on the pod: mmpose's eval loop, ground-truth boxes, flip_test on, torch
# weights. This row is the other end of the pipe: the exported ONNX, ONNX Runtime CPU,
# rtmlib's affine crop and SimCC decode, and boxes from the stock-m detector. It is not a
# better or a worse measurement of the model; it is a measurement of a different thing,
# and it exists because the verifiers consume the artifact measured here, not the one
# measured on the pod. Do not put this number next to 0.774115 as if the pair were a
# regression. The honest comparison is row 2 against row 3 (flip) and row 1 (body7)
# against row 2 on the identical path.
#
# Row 1 (configs/eval/coco500_pose_body7_e48f03d0.yaml) has to reproduce its recorded
# 0.729 before this row is allowed to run; the ladder enforces it.
#
# Provenance, under POLICY.md, rule 8. Trained: COCO 2017 person keypoints only.
# Initialised from body7 `...e48f03d0...`, so the lineage carries body7's mixture (AI
# Challenger, CrowdPose, MPII, sub-JHMDB, Halpe, PoseTrack18) and the CSPNeXt `pt-body7`
# backbone. No published RTMPose checkpoint is AIC-free. Shippability is a question for
# counsel, not for this config. Provenance record: final_models/joints/README.md.
#
# Note: the ONNX is committed at final_models/joints/model.onnx (54,369,587 bytes), whose
# digest is the one pinned below. It is a Git LFS object, so run `git lfs pull` on a fresh
# clone before this row.
schema_version: 1
run_name: coco500_pose_v2_6ba96285_noflip

dataset:
  registry_name: coco
  split: val
  subset_file: configs/eval/subset_coco_val_person500.json

detector:
  # Identical to row 1, byte for byte. The boxes are the control variable.
  backend: rtmlib
  onnx: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmdet_m_8xb32-100e_coco-obj365-person-235e8209.zip
  input_size: [640, 640]
  device: cpu
  score_thr: 0.05
  name: rtmdet-m-person-onnx
  sha256: 4f4d7e07350b1753299111d1ae500fd64447a5b0e38e4bacbefab6573c742d30

pose:
  backend: rtmlib
  onnx: final_models/joints/model.onnx
  input_size: [192, 256]
  device: cpu
  name: rtmpose-m-person-v2-onnx-6ba96285
  sha256: 6ba9628506a8899d3a3e940dcc8af5d30342921f09d2605afa505b57453d3527

tracker: null

conditions:
  - name: clean
    kind: passthrough

logging:
  out_root: outputs/eval
