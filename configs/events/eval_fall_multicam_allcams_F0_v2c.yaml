# Fall F0 refit on the v2c trees, median-val seed 20260901 (onnx baa93141)
# One pre-declared look per research/fall-push-v3-protocol.md, on the v2c tree.
# window: must equal the fall trainers' geometry (8.0 s contain, n_steps 64).
#
#   uv run python scripts/events/eval_event_verifier.py --config configs/events/eval_fall_multicam_allcams_F0_v2c.yaml
schema_version: 1
task: fall
window:
  window_s: 8.0
  stride_s: 1.5
  n_steps: 64
  policy: contain
  min_present: 0.35
  contain_margin_s: 0.5
sources:
  - dir: outputs/events/multicam_allcams_tracks_v2c
    event_keys: [fall_start_t, fall_end_t]
model:
  onnx: outputs/verifier/fall_F0_v2c_s20260901/verifier.onnx
out_dir: outputs/verifier/fall_F0_v2c_s20260901/eval_multicam_allcams
