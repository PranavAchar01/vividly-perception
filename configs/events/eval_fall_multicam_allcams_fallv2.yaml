# fall v2 against the all-cameras Montreal Multi-Cam test surface (192 views).
# One pre-declared look, part of the 2026-08-28 full-testing expansion. All three
# fall models (v1 080b5d86 / v2 e9cebe4d / v3 67954c04) get this identical look so
# the per-camera-angle picture is uniform; nothing is selected on it. The fall
# slot was settled on the reference-camera exams and this surface measures the
# angle axis (the residual all three carried: misses concentrate on high cameras).
# window: must equal the fall trainers' geometry (8.0 s contain, n_steps 64).
#
#   uv run python scripts/events/eval_event_verifier.py --config configs/events/eval_fall_multicam_allcams_fallv2.yaml
schema_version: 1
task: fall
window:
  window_s: 8.0
  stride_s: 1.5
  n_steps: 64
  policy: contain
  min_present: 0.35
  contain_margin_s: 0.5
sources:
  - dir: outputs/events/multicam_allcams_tracks_v1
    event_keys: [fall_start_t, fall_end_t]
model:
  onnx: outputs/verifier/fall_v2/verifier.onnx
out_dir: outputs/verifier/fall_v2/eval_multicam_allcams
