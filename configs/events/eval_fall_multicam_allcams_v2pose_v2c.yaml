# Fall bar holder fall_v2pose b66c3a0a (v2pose lineage) re-sliced onto the v2c exam
# trees with its weights untouched.
# One pre-declared look per research/fall-push-v3-protocol.md, on the v2c tree.
# window: must equal the fall trainers' geometry (8.0 s contain, n_steps 64).
#
#   uv run python scripts/events/eval_event_verifier.py --config configs/events/eval_fall_multicam_allcams_v2pose_v2c.yaml
schema_version: 1
task: fall
window:
  window_s: 8.0
  stride_s: 1.5
  n_steps: 64
  policy: contain
  min_present: 0.35
  contain_margin_s: 0.5
sources:
  - dir: outputs/events/multicam_allcams_tracks_v2c
    event_keys: [fall_start_t, fall_end_t]
model:
  onnx: outputs/verifier/fall_v2pose/verifier.onnx
out_dir: outputs/verifier/fall_v2pose_reslice_v2c/eval_multicam_allcams
