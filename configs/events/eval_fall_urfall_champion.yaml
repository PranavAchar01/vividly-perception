# Fall push v3 exam look: the model of record fall_v3 67954c04 re-sliced onto the
# v2pose trees, so both lineages share one negative pool.
# One pre-declared look per research/fall-push-v3-protocol.md (2026-09-05).
# Clone of eval_fall_urfall_v2pose.yaml; only model.onnx and out_dir differ.
# The graph is the committed lane weight final_models/fall/model.onnx; its digest is in
# final_models/fall/model.onnx.sha256 and its provenance is on final_models/fall/README.md.
# window: must equal the fall trainers' geometry (8.0 s contain, n_steps 64), because
# the exam surface and its labelling are identical across every arm.
#
#   uv run python scripts/events/eval_event_verifier.py --config configs/events/eval_fall_urfall_champion.yaml
schema_version: 1
task: fall
window:
  window_s: 8.0
  stride_s: 1.5
  n_steps: 64
  policy: contain
  min_present: 0.35
  contain_margin_s: 0.5
sources:
  - dir: outputs/events/ur_fall_tracks_v2pose
    event_keys: [fall_start_t, fall_end_t]
model:
  onnx: final_models/fall/model.onnx
out_dir: outputs/verifier/fall_champion_reslice_v2pose/eval_ur_fall
