# convulsion_v2_real, the seizure model of record, on the same held-out patient split as
# every comparison evaluation, giving the v1 against v2 comparison row. Test extraction is
# the generation 2 eyes tracks_v2 (a v2 model must be tested through the eyes it deploys
# with); the patient split is identical to eval_wusahzu_testsplit_real.yaml and the
# geometry is the shared comparison window. scene_channels must match the model's training
# window.
# The graph is the committed lane weight final_models/seizure/model.onnx, sha256
# 07c399be24f89a44670262ea75879cc67f60f46c5cd52e5d2cc4218e914b7e22.
# Paths under outputs/ are gitignored run directories built by the extraction and
# evaluation steps, not files in version control.
#
#   uv run python scripts/events/eval_event_verifier.py --config configs/events/eval_wusahzu_testsplit_v2real.yaml
schema_version: 1
task: convulsion
window:
  window_s: 12.0
  stride_s: 3.0
  n_steps: 64
  policy: overlap
  overlap_min_s: 4.0
  min_present: 0.35
  scene_channels: true
sources:
  - dir: outputs/events/wu_sahzu_tracks_v2
    locations: [pat03, pat07, pat14, pat04, pat09, pat11]
model:
  onnx: final_models/seizure/model.onnx
out_dir: outputs/verifier/convulsion_v2_real/eval_wusahzu_testsplit
