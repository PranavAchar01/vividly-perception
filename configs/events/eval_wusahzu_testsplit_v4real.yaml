# seizure v4 on the same held-out patient split as every comparison evaluation: the
# v2 against v4 comparison row. Test extraction is wu_sahzu_tracks_v2 (v4 deploys on
# the same chained 55c2c242 eyes as v2, so the exam pool is identical to v2's, and
# window-level numbers are directly comparable, not just event-level ones).
# The patient split matches eval_wusahzu_testsplit_real.yaml; scene_channels
# matches the training window. This is v4's single pre-declared test look. The arm is
# now barred: final_models/seizure/README.md records v4 as banked, then barred, because
# its negative diet came from corpora that have since been removed from this repository,
# and its training configuration went with them. This file is retained only as the record
# of the 0.66889 window AUC that look produced.
# Paths under outputs/ are gitignored run directories built by the extraction and
# evaluation steps, not files in version control.
#
#   uv run python scripts/events/eval_event_verifier.py --config configs/events/eval_wusahzu_testsplit_v4real.yaml
schema_version: 1
task: convulsion
window:
  window_s: 12.0
  stride_s: 3.0
  n_steps: 64
  policy: overlap
  overlap_min_s: 4.0
  min_present: 0.35
  scene_channels: true
sources:
  - dir: outputs/events/wu_sahzu_tracks_v2
    locations: [pat03, pat07, pat14, pat04, pat09, pat11]
model:
  onnx: outputs/verifier/convulsion_v4_real/verifier.onnx
out_dir: outputs/verifier/convulsion_v4_real/eval_wusahzu_testsplit
