# seizure v6 on the same held-out patient split as every comparison evaluation, giving
# the v2 against v4 against v6 comparison row. Test extraction is wu_sahzu_tracks_v2
# (v6 deploys on the same chained 55c2c242 eyes as v2 and v4, so the exam pool is
# identical and window-level numbers are directly comparable, not just
# event-level ones). The patient split matches eval_wusahzu_testsplit_real.yaml;
# scene_channels matches the training window. This is v6's single pre-declared
# test look; the decision study that followed ran with the corrected 0.944 h
# denominator and the time-in-alarm instrument, and its figures are recorded in
# research/stats-compendium.md.
# Paths under outputs/ are gitignored run directories built by the extraction and
# evaluation steps, not files in version control.
#
#   uv run python scripts/events/eval_event_verifier.py --config configs/events/eval_wusahzu_testsplit_v6real.yaml
schema_version: 1
task: convulsion
window:
  window_s: 12.0
  stride_s: 3.0
  n_steps: 64
  policy: overlap
  overlap_min_s: 4.0
  min_present: 0.35
  scene_channels: true
sources:
  - dir: outputs/events/wu_sahzu_tracks_v2
    locations: [pat03, pat07, pat14, pat04, pat09, pat11]
model:
  onnx: outputs/verifier/convulsion_v6_real/verifier.onnx
out_dir: outputs/verifier/convulsion_v6_real/eval_wusahzu_testsplit
