# v2pose exam: single-look protocol on the v2pose re-extraction of the same
# held-out patients as the exam it clones, 2026-09-04.
# This is a supplementary exam, the 4 unallocated WU-SAHZU patients through
# convulsion_v2pose, the alternative recorded on the seizure lane. The original
# patient allocation left pat06, pat08, pat10 and pat12 out of both train and test
# as label-uncertain, and the 2026-08-28 expansion of testing coverage put them
# under the instruments. All 12 of their videos were extracted into
# wu_sahzu_tracks_v2pose, the tree this config reads, and scored; the 12-video
# unallocated row is recorded in research/seizure-v2pose-comparison.md. The window
# pool of this tree is not the pool of wu_sahzu_tracks_v2:
# final_models/seizure/README.md records the 1,386 windows with 178 positive against
# the v2 tree and states that the two surfaces differ.
# Every event is focal, P, outside the
# convulsive target of the acute-event rule set, and the onset labels carry the
# same label uncertainty, so latency numbers are indicative only. This is not
# part of the primary held-out exam and does not amend it, and it never selects
# variants. These patients are allocated to the exam side permanently, as
# POLICY.md, rule 4 records under permanent allocations: this supplement is the
# second seizure exam surface, and the earlier train-side proposal is closed,
# because they never enter a training manifest.
# Paths under outputs/ are gitignored run directories built by the extraction and
# evaluation steps, not files in version control.
#
#   uv run python scripts/events/eval_event_verifier.py --config configs/events/eval_wusahzu_unallocated_v2pose.yaml
schema_version: 1
task: convulsion
window:
  window_s: 12.0
  stride_s: 3.0
  n_steps: 64
  policy: overlap
  overlap_min_s: 4.0
  min_present: 0.35
  scene_channels: true
sources:
  - dir: outputs/events/wu_sahzu_tracks_v2pose
    locations: [pat06, pat08, pat10, pat12]
model:
  onnx: outputs/verifier/convulsion_v2pose/verifier.onnx
out_dir: outputs/verifier/convulsion_v2pose/eval_wusahzu_unallocated
