# Supplementary exam: the 4 unallocated WU-SAHZU patients through seizure v4, the
# recall-ceiling arm that final_models/seizure/README.md records as banked, then barred,
# because its negative diet came from corpora that have since been removed from this
# repository. Same declaration, scope and caveats as eval_wusahzu_unallocated_v2.yaml:
# focal-only events, uncertainty in the focal labelling, all 12 videos extracted and
# scored, not part of the primary exam, never selects variants. From 2026-08-28 these
# patients sit exam-side permanently and train nothing.
# Paths under outputs/ are gitignored run directories built by the extraction and
# evaluation steps, not files in version control.
#
#   uv run python scripts/events/eval_event_verifier.py --config configs/events/eval_wusahzu_unallocated_v4.yaml
schema_version: 1
task: convulsion
window:
  window_s: 12.0
  stride_s: 3.0
  n_steps: 64
  policy: overlap
  overlap_min_s: 4.0
  min_present: 0.35
  scene_channels: true
sources:
  - dir: outputs/events/wu_sahzu_tracks_v2
    locations: [pat06, pat08, pat10, pat12]
model:
  onnx: outputs/verifier/convulsion_v4_real/verifier.onnx
out_dir: outputs/verifier/convulsion_v4_real/eval_wusahzu_unallocated
