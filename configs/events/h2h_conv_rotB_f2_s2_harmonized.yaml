# H2h control run B (s2 seed replicate), the channel-masking arm. Identical to run A except in
# three fields: the AJILE12 source directory, which points at a fingerprint-harmonized copy of
# the diet; the seed, 20260901 against run A's 20260826; and out_dir.
# Report-only (research/seizure-push-2-protocol.md item 4; record in
# research/seizure-ajile12-negative-control.md). Nothing committed changes behaviour: the harmonized
# tree is generated once into gitignored outputs/ and only this config consumes it.
#
# What the harmonized tree changes, per row: `kpc` and `angle` only. Every motion field
# (f, t, track, cx, cy, w, h) and the `kp` block are copied unchanged, so vy/vx/h_rel/
# aspect/present and the scene channels are bit-identical to run A's. Each AJILE12 track is
# handed the (kpc, angle) series of one real WU track drawn from the F2 training patients only
# (pat01 pat04 pat05 pat11 pat13 pat14; the validation patients pat02 and pat09 are excluded so
# no validation-side statistic reaches a training row), sampled with probability proportional to
# donor length and read from a random wrapped offset. angle is transplanted rather than imputed
# because features.featurize_window derives angle_norm from the same field angle_valid
# flags: angle_valid 0 implies angle_norm 0 in every real row, so imputing angle_norm under
# a pinned angle_valid 0 would manufacture a state that occurs nowhere in the WU data.
schema_version: 1
task: convulsion
window:
  window_s: 12.0
  stride_s: 3.0
  n_steps: 64
  policy: overlap
  overlap_min_s: 4.0
  min_present: 0.35
  scene_channels: true
sources:
- dir: outputs/events/wu_sahzu_tracks_v2pose
  locations:
  - pat01
  - pat02
  - pat04
  - pat05
  - pat09
  - pat11
  - pat13
  - pat14
- dir: outputs/events/ajile12_neg_tracks_v1_h2h
  force_label: 0
holdout_fraction: 0.2
model:
  hidden: 64
  blocks: 3
  dropout: 0.15
train:
  epochs: 60
  batch: 256
  lr: 0.001
  weight_decay: 0.0001
  pos_weight: auto
  seed: 20260901
  device: cpu
out_dir: outputs/verifier/h2h/b_harmonized_s2
holdout_locations:
- pat02
- pat09
