# Final arm-B recipe refit on the WU-SAHZU v2c track tree. Coupling chain: eyes
# RT-DETRv4-S checkpoint 345c30a5, ONNX 40262049, with pose RTMPose-m checkpoint a0a035fe,
# ONNX 6ba96285, re-extracted on 2026-09-07 through
# configs/events/extract_wu_sahzu_v2c.yaml; the detector probe behind that chain is
# research/eyes-coupling-probe.md. Clone of configs/events/rot_train_conv_finalB.yaml with
# exactly two changes: the WU source dir points at wu_sahzu_tracks_v2c, and out_dir.
# Full 8-patient pool, holdout pat02/pat09 for checkpoint selection only, seed 20260826,
# AJILE12 negative diet unchanged (pose-space, not re-extracted).
schema_version: 1
task: convulsion
window:
  window_s: 12.0
  stride_s: 3.0
  n_steps: 64
  policy: overlap
  overlap_min_s: 4.0
  min_present: 0.35
  scene_channels: true
sources:
- dir: outputs/events/wu_sahzu_tracks_v2c
  locations:
  - pat01
  - pat02
  - pat04
  - pat05
  - pat09
  - pat11
  - pat13
  - pat14
- dir: outputs/events/ajile12_neg_tracks_v1
  force_label: 0
holdout_fraction: 0.2
model:
  hidden: 64
  blocks: 3
  dropout: 0.15
train:
  epochs: 60
  batch: 256
  lr: 0.001
  weight_decay: 0.0001
  pos_weight: auto
  seed: 20260826
  device: cpu
out_dir: outputs/verifier/conv_finalB_v2c
holdout_locations:
- pat02
- pat09
