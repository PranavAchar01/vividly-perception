# Push-2 arm AUG is arm B plus track-space augmentation, that is mirror vx, bounded
# time warp 0.85 to 1.18, and contiguous observation dropout with present at or
# above 0.5. Draws are online per epoch, on training rows only, applied after
# grouped_split. See POLICY.md, rule 4, augmentation is not synthesis, and
# research/seizure-push-2-protocol.md item 3.
schema_version: 1
task: convulsion
window:
  window_s: 12.0
  stride_s: 3.0
  n_steps: 64
  policy: overlap
  overlap_min_s: 4.0
  min_present: 0.35
  scene_channels: true
sources:
- dir: outputs/events/wu_sahzu_tracks_v2pose
  locations:
  - pat01
  - pat02
  - pat04
  - pat05
  - pat09
  - pat11
  - pat13
  - pat14
- dir: outputs/events/ajile12_neg_tracks_v1
  force_label: 0
holdout_fraction: 0.2
model:
  hidden: 64
  blocks: 3
  dropout: 0.15
train:
  epochs: 60
  batch: 256
  lr: 0.001
  weight_decay: 0.0001
  pos_weight: auto
  seed: 20260826
  device: cpu
out_dir: outputs/verifier/conv_p2aug/f1_s1
holdout_locations:
- pat01
- pat04
augment:
  mirror_p: 0.5
  warp_p: 0.5
  warp_min: 0.85
  warp_max: 1.18
  dropout_p: 0.5
  dropout_max_frac: 0.25
