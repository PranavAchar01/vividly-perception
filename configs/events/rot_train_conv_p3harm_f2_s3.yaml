# Push 3 candidate (harmonized diet) arm, fold F2, seed 20260905 (reproduction, regression gate).
# Pre-declared in research/seizure-push-3-protocol.md (commit bfd7839).
# Exactly three fields differ from configs/events/rot_train_conv_finalB.yaml:
# out_dir, train.seed, and the AJILE12 negative-diet source `dir`, which becomes
# ajile12_neg_tracks_v1_h2h, the one variable of this push. No `augment:`,
# `negative_class_weights:` or `geo_augment:` key is present, by declaration.
schema_version: 1
task: convulsion
window:
  window_s: 12.0
  stride_s: 3.0
  n_steps: 64
  policy: overlap
  overlap_min_s: 4.0
  min_present: 0.35
  scene_channels: true
sources:
- dir: outputs/events/wu_sahzu_tracks_v2pose
  locations:
  - pat01
  - pat02
  - pat04
  - pat05
  - pat09
  - pat11
  - pat13
  - pat14
- dir: outputs/events/ajile12_neg_tracks_v1_h2h
  force_label: 0
holdout_fraction: 0.2
model:
  hidden: 64
  blocks: 3
  dropout: 0.15
train:
  epochs: 60
  batch: 256
  lr: 0.001
  weight_decay: 0.0001
  pos_weight: auto
  seed: 20260905
  device: cpu
out_dir: outputs/verifier/conv_p3harm/f2_s3
holdout_locations:
- pat02
- pat09
