# Fall push v3, arm F0 (control floor), seed 20260910, pre-declared in
# research/fall-push-v3-protocol.md (2026-09-05). This seed extends the
# control arm from 3 to 5 seeds for arm F2 (fall_kpgeo_v1): the kp arm runs 5
# seeds, so its control runs the same 5; the first 3 control runs are the
# existing outputs/verifier/fall_F0_s{20260826,20260901,20260905} (identical
# config, only the seed differs).
#
#   uv run python scripts/events/train_event_verifier.py --config configs/events/train_fall_F0_s20260910.yaml
#
# Clone of train_fall_F0_s20260826.yaml; only seed and out_dir differ.
schema_version: 1
task: fall
window:
  window_s: 8.0
  stride_s: 1.5
  n_steps: 64
  policy: contain
  min_present: 0.35
  contain_margin_s: 0.5
sources:
  - dir: outputs/events/le2i_tracks_v2pose
    event_keys: [fall_start_t, fall_end_t]
  - dir: outputs/events/gmdcsa24_tracks_v2pose
    event_keys: [fall_start_t, fall_end_t]
  - dir: outputs/events/caucafall_tracks_v2pose
    event_keys: [fall_start_t, fall_end_t]
holdout_locations: [Home_02, S4_ADL, S4_Fall, S9, S10]
model:
  hidden: 64
  blocks: 3
  dropout: 0.15
train:
  epochs: 60
  batch: 256
  lr: 0.001
  weight_decay: 0.0001
  pos_weight: auto
  seed: 20260910
  device: cpu
out_dir: outputs/verifier/fall_F0_s20260910
