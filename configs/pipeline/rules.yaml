# Vividly rule thresholds: the acute-event rule set, stated in POLICY.md, dated 2026-08-19,
# split into one file per rule head on 2026-09-09 (Clip Library design, P2).
#
# This file is the index. The thresholds live in configs/pipeline/rules/<head>.yaml, one
# file per head plus the engine's own keys, so that a pipeline profile can include exactly
# the heads it may run and a stored Clip's basis can hash the fired rule's own file and
# nothing else. Including every file here reproduces the full rule set of every profile
# that existed before the split; tests/test_rules.py pins the merged result equal to the
# RuleConfig defaults in src/vividly/rules/base.py and pins that no threshold appears in
# more than one file.
#
# Every value in those files is PROVISIONAL (the acute-event rule set, POLICY.md;
# docs/CALIBRATION.md): read the header of each one before changing a number, do not quote
# any of them as a product number, and do not read a firing count from any run as a
# false-alarm rate. Loaded by vividly.rules.load_rule_config, which resolves `include`
# relative to this file and refuses a threshold set by two included files.

rules:
  include:
    - rules/engine.yaml
    - rules/fall_then_still_v0.yaml
    - rules/seizure_candidate_v0.yaml
    - rules/egress_without_discharge_v0.yaml
