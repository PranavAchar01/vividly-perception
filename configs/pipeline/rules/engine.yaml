# Vividly rule engine thresholds: the debounce and evaluation cadence shared by every rule
# head (vividly.rules.engine). One of the per-rule files under configs/pipeline/rules/;
# configs/pipeline/rules.yaml is the index that includes all of them, and a pipeline profile
# may include any subset (the Clip Library profile includes only the two heads it may run,
# design P2, 2026-09-09).
#
# Every value in this file is PROVISIONAL (the acute-event rule set, POLICY.md;
# docs/CALIBRATION.md): not one of them has been fitted to data, and none can be until pilot
# shadow-mode data exists. Do not quote a number from here as a product number and do not
# read a firing count from any run as a false-alarm rate. Loaded by
# vividly.rules.load_rule_config; pinned equal to the RuleConfig defaults by tests/test_rules.py.

rules:

  # PROVISIONAL (the acute-event rule set, POLICY.md; docs/CALIBRATION.md).
  # One (rule_id, track_id) pair fires at most once per this many seconds. The value is an
  # estimate: long enough that one event does not fill the queue, short enough that a nurse
  # who dismissed one is told again. Note that fall_then_still_v0 alerts on the event, not
  # the state: once the fall evidence ages out of collapse_search_s a person still on the
  # ground does not re-alert, so this debounce is a repeat guard, not the only guard. The
  # alerts-per-nurse-per-shift ceiling that decides this properly is an input to calibration
  # step 2 and is fixed before any sweep, not tuned afterwards.
  refire_after_s: 900.0

  # Off at 0.0, and PROVISIONAL (the acute-event rule set, POLICY.md; docs/CALIBRATION.md)
  # if ever turned on: a second, coarser debounce keyed on the rule alone, so that rule
  # alerts at most once per this many seconds no matter which track fires it. The replay
  # pipeline opens one source per process, so rule scope is camera scope; this is the live
  # form of the camera-level episode merge the decision-layer instrument reports,
  # research/operating-points.md, section 5, item 2 (per-camera episode merge). The
  # measured saving at the recommended operating points is real but modest: the seizure
  # model of record, onnx sha8 07c399be, at 0.8 goes from 54.4 to 32.6 episodes per
  # negative-recording hour on the 0.184 h of E2 negatives, while the out-of-fold and fall
  # surfaces save close to nothing. It therefore stays off until pilot shadow data says a
  # nurse needs it. 0.0 leaves the per-rule, per-track debounce above as the only guard,
  # which is the shipped behaviour.
  camera_refire_after_s: 0.0

  # PROVISIONAL (the acute-event rule set, POLICY.md; docs/CALIBRATION.md), a behaviour
  # choice and not a fitted threshold: minimum source-time gap between evaluation passes.
  # The pipeline ticks once per frame at 15 fps and every confirmation window is tens of
  # seconds long, so re-deciding 15 times a second costs a lot and changes nothing. Onset
  # accuracy does not depend on this: onsets are recovered from stored history, not from
  # tick timing.
  eval_every_s: 1.0
