# DEIM-D-FINE-S person fine-tune: v2 bake-off Model A (step-1 build, 2026-08-31).
#
# This recipe is the DEIM arm of the eyes bake-off. Its three seeds are recorded in
# final_models/eyes/README.md, and its best seed, checkpoint e98de401 at dev-val AP
# 0.8341, is retained as the fallback behind the model of record, RT-DETRv4-S
# checkpoint 345c30a5 at 0.8356.
#
# Every path below is the pod layout described in TRAINING.md, not a repository path.
#
# Installed by scripts/pod/setup_pod.sh into <DEIM>/configs/deim_dfine/, where the
# relative __include__ resolves against the vendored repo at pin 09d35d5 (see
# third_party/PINS.yaml). The sibling deim_s_person_v2_zeroshot_eval.yml carries no
# such install line: no script copies it, and the operator installs it by hand into
# the same directory. Launch (single 5090, plain python; torchrun would wrap
# DDP and empty negative frames then desync the denoising branch, DEIM #32; plain
# python is safe because -t forces pretrained=False past the get_rank() crash):
#
#   python train.py -c configs/deim_dfine/deim_s_person_v2.yml \
#       --use-amp --seed=0 -t /workspace/ckpt/deim_dfine_s_coco.pth
#
# Never pass -d cuda:0 (autocast rejects it); select the GPU with CUDA_VISIBLE_DEVICES.
# On NaN: drop --use-amp (PINS.yaml contingency nan_amp) and watch for ./NaN.pth.
#
# Provenance card: deltas from the published COCO recipe (deim_hgnetv2_s_coco.yml),
# each with its reason; everything not listed is inherited unchanged:
#   num_classes 80 -> 1, remap_mscoco_category True -> False
#       person-only corpus; the project's JSONs emit category_id 0 (v2 corpus rule:
#       both trainers index the class head by raw category_id when remap is off).
#   epoches 132 -> 48; flat_epoch 64 -> 28; policy.epoch [4,64,120] -> [4,28,40];
#   mixup_epochs [4,64] -> [4,28]; stop_epoch 120 -> 40; no_aug_epoch 12 -> 8
#       fine-tune from strong COCO init needs far fewer epochs; the whole schedule
#       moves together by the repo's own formulas (flat = 4 + epoches//2; stage-2
#       no-aug window = epoches - stop_epoch = no_aug_epoch, so the best_stg1
#       reload at the stage boundary fires with the file guaranteed present).
#   warmup_iter 2000 -> 800
#       scaled ~linearly with schedule length (48/132 x 2000 ~= 727).
#   lr 4e-4 -> 2e-4, backbone lr 2e-4 -> 1e-4
#       the values of record: no separate learning-rate probe was run, and these are
#       the values behind all three measured DEIM seeds, 0.8329 (5185d500), 0.8341
#       (e98de401) and 0.8333 (32a783a3), recorded in research/eyes-noise-floor.md and
#       final_models/eyes/README.md. Standard halving for fine-tune on a narrower
#       task; batch stays at the recipe's 32 (fits one 32 GB 5090: RT-DETRv4-S
#       reference logs ~5.6 GB/rank x 4 at the same size), so no linear-scaling of
#       EMA/warmup is owed. The optimizer params list is repeated in full below
#       because YAML lists merge by wholesale replacement, not element-wise.
#   dataset paths -> /workspace/data/person_v2
#       dev-val is Warehouse_005 held out by scene from training (frame-filtered
#       to stride 150); the SmartSpaces val scenes are exam-side and per-epoch
#       checkpoint selection must never touch them (registry exam rule).
#   loss/criterion: unchanged. batch_scale=8/N in the DDF loss cancels exactly
#       (PINS.yaml ddf_batch_scale), so no compensation for single-GPU bs32 is needed.
#
# The reported-performance artifact is best_stg2.pth (maintainer, DEIM #56).
__include__: ['./deim_hgnetv2_s_coco.yml']

output_dir: /workspace/outputs/deim_s_person_v2

num_classes: 1
remap_mscoco_category: False

epoches: 48
flat_epoch: 28
no_aug_epoch: 8
warmup_iter: 800

train_dataloader:
  # num_workers 16 (recipe default 4): throughput-only. The 5090 sat data-starved
  # at 0.84 s/it (24-min epochs) decoding 1080p mosaic batches with 4 workers on
  # a 48-vCPU pod, measured live 2026-09-01, seed 0 epochs 0-5. Not part of the
  # training recipe; identical across all noise-floor seeds.
  num_workers: 16
  dataset:
    img_folder: /workspace/data/person_v2/frames/train
    ann_file: /workspace/data/person_v2/annotations/person_v2_train.json
    transforms:
      policy:
        epoch: [4, 28, 40]
  collate_fn:
    mixup_epochs: [4, 28]
    stop_epoch: 40
  total_batch_size: 32

val_dataloader:
  num_workers: 8
  dataset:
    img_folder: /workspace/data/person_v2/frames/train
    ann_file: /workspace/data/person_v2/annotations/person_v2_devval.json
  total_batch_size: 64

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001
