# RT-DETRv4-S person fine-tune, DINOv3 teacher disabled: v2 bake-off Model B
# (step-1 build, 2026-08-31).
#
# This is the recipe of record for the eyes lane. Seed 0 produced checkpoint
# 345c30a5, exported as ONNX 40262049, dev-val AP 0.50:0.95 0.8356 against the
# pre-registered bar 0.8353; the lane page is final_models/eyes/README.md.
#
# Every path below is the pod layout described in TRAINING.md, not a repository path.
#
# Installed by scripts/pod/setup_pod.sh into <RT-DETRv4>/configs/rtv4/. This file is
# a fork of rtv4_hgnetv2_s_coco.yml with the DINOv3 blocks removed, not overridden:
# the teacher can only be disabled by the key's absence (yaml_config.py gates on
# `'teacher_model' in yaml_cfg`, and a present-but-altered type raises), and this
# fork's include chain (dfine_hgnetv2_s_coco.yml + base/rtv4.yml) carries no
# teacher_model key anywhere. Consequences, all verified against the vendored tree
# at this pin:
#   - no DINOv3 weights are ever downloaded, no Meta click-wrap is ever accepted;
#   - distill_teacher_dim: 0 means the feature_projector is never built, so there
#     is no unused parameter under DDP and the saved checkpoint strict-loads at
#     export time with this same config;
#   - losses drops 'distill' (it would be a constant 0 anyway); the dead
#     loss_distill entry left in weight_dict by the base include is never computed;
#   - C-1 stands: the released rtv4_s_coco.pth init was trained with the teacher.
#     Counsel question, recorded in PINS.yaml, not resolvable here.
#
# Launch (single 5090, plain python, for the same reason as Model A; -t skips the
# backbone download whose error path crashes without a process group):
#
#   python train.py -c configs/rtv4/rtv4_s_person_v2_noteacher.yml \
#       --use-amp --seed=0 -t /workspace/ckpt/rtv4_s_coco.pth
#
# Never pass -d cuda:0, which autocast rejects; select the GPU with
# CUDA_VISIBLE_DEVICES. CPU smoke of this config is impossible: the
# distill-disabled loss path hardcodes a CUDA tensor.
#
# The distill-enabled sibling of this file is rtv4_s_person_v2_dinov2t.yml (arm
# B2-DINOv2T). It is identical to this file except the three distillation keys
# below, inverted, and its own output_dir, /workspace/outputs/rtv4_s_person_v2_b2_dinov2t.
# The two recipes stay in lockstep: any change under `num_classes:` in one must be
# made in the other or the arms stop comparing.
#
# Provenance card: deltas from the published rtv4_hgnetv2_s_coco.yml recipe:
#   teacher_model block, loss_distill: 5 override  -> removed (above).
#   HybridEncoder.distill_teacher_dim 768 -> 0                 (above).
#   RTv4Criterion.losses -> ['mal','boxes','local']            (above).
#   Correction 2026-09-05 (research/eyes-dinov2-teacher-arm.md, section 3, which
#     projector and level the S model uses):
#     this card previously also listed a removed GAM block. There
#     is no GAM at this pin: `grep -rni gam` over the whole RT-DETRv4 tree at
#     55fefaae matches only the words Game board in two commented-out Objects365
#     class lists in engine/solver/_solver.py. The line had no referent and
#     is deleted. Documentation error only: the config itself was always correct.
#   num_classes/remap/schedule/warmup/lr/paths -> identical deltas, identical
#       reasons, and the same values as Model A's card (deim_s_person_v2.yml) so
#       the bake-off compares architectures, not schedules. No separate
#       learning-rate probe was run: these lr values produced the model of record,
#       seed 0 checkpoint 345c30a5 at dev-val AP 0.8356 against the bar 0.8353
#       (final_models/eyes/README.md, research/eyes-rtdetrv4-training-record.md).
#       Loss internals untouched (ddf batch_scale cancels).
__include__: ['../dfine/dfine_hgnetv2_s_coco.yml', '../base/rtv4.yml']

output_dir: /workspace/outputs/rtv4_s_person_v2

HybridEncoder:
  distill_teacher_dim: 0

RTv4Criterion:
  losses: ['mal', 'boxes', 'local']

num_classes: 1
remap_mscoco_category: False

epoches: 48
flat_epoch: 28
no_aug_epoch: 8
warmup_iter: 800

train_dataloader:
  # num_workers 16 (recipe default 4): throughput-only. The 5090 sat data-starved
  # at 0.84 s/it (24-min epochs) decoding 1080p mosaic batches with 4 workers on
  # a 48-vCPU pod, measured live 2026-09-01, seed 0 epochs 0-5. Not part of the
  # training recipe; identical across all noise-floor seeds.
  num_workers: 16
  dataset:
    img_folder: /workspace/data/person_v2/frames/train
    ann_file: /workspace/data/person_v2/annotations/person_v2_train.json
    transforms:
      policy:
        epoch: [4, 28, 40]
  collate_fn:
    mixup_epochs: [4, 28]
    stop_epoch: 40
  total_batch_size: 32

val_dataloader:
  # 0 (was 8): the epoch-5->eval boundary deadlocked live (2026-09-03, B1):
  # main thread in do_poll, exactly 8 spawned val workers wedged at fork.
  # Single-process eval adds ~45 s per epoch and cannot fork-deadlock. The
  # setting is recorded in the Model B section of research/eyes-noise-floor.md;
  # the /proc wchan observation itself is recorded only here.
  # Throughput-only; DEIM keeps 8.
  num_workers: 0
  dataset:
    img_folder: /workspace/data/person_v2/frames/train
    ann_file: /workspace/data/person_v2/annotations/person_v2_devval.json
  total_batch_size: 64

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001
